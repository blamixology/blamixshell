[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blamixshell"
version = "1.0.0"
description = "Modern SSH client: server manager, split panes, SFTP, encrypted vault. Desktop GUI, TUI and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "paramiko>=3.4",
  # cryptography 49+ ships no Intel-mac wheel (a source build links Homebrew OpenSSL and breaks bundling)
  'cryptography>=42,<49; sys_platform == "darwin" and platform_machine == "x86_64"',
  'cryptography>=42; sys_platform != "darwin" or platform_machine != "x86_64"',
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
tui = ["textual>=0.80"]
all = ["PySide6>=6.7", "textual>=0.80"]

[project.scripts]
blamixshell = "blamixshell.cli:main"

[project.gui-scripts]
blamixshell-gui = "blamixshell.main:main"

[tool.setuptools]
packages = ["blamixshell"]

[tool.setuptools.package-data]
blamixshell = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
