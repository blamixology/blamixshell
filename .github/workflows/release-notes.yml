# Manually (re)generate the notes of an existing release.
# (CHANGELOG.md is updated locally by ./release.sh, never by CI.)
# GitHub → Actions → "Regenerate release notes" → Run workflow → enter a tag (e.g. v1.0.1).
name: Regenerate release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main }
      - name: Update the release's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 packaging/release_notes.py "${{ inputs.tag }}" --repo "${{ github.repository }}" > notes.md
          cat notes.md
          gh release edit "${{ inputs.tag }}" --notes-file notes.md
