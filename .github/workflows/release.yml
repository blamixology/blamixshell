name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) fast unit/TUI tests on all three OSes
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
      - run: pip install -r requirements.txt textual pytest pexpect
      - run: pytest -q tests
        env: { QT_QPA_PLATFORM: offscreen }

  # 2) live tests against a real OpenSSH server: shell, resize, SFTP, key auth,
  #    jump host, host-key prompts, parallel exec, CLI + TUI in a real pty
  test-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Start a throwaway sshd on 127.0.0.1:2222
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server libegl1 libxkbcommon0 libgl1
          sudo useradd -m -s /bin/bash tester
          echo 'tester:Secret123!' | sudo chpasswd
          ssh-keygen -t ed25519 -N pp -f "$RUNNER_TEMP/id_ed25519" -q
          sudo install -d -m 700 -o tester /home/tester/.ssh
          sudo install -m 600 -o tester "$RUNNER_TEMP/id_ed25519.pub" /home/tester/.ssh/authorized_keys
          printf 'Port 2222\nListenAddress 127.0.0.1\nPasswordAuthentication yes\nKbdInteractiveAuthentication no\nUsePAM yes\nSubsystem sftp /usr/lib/openssh/sftp-server\nPidFile /tmp/sshd-test.pid\n' > "$RUNNER_TEMP/sshd_config"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config"
          sleep 1
      - run: pip install -r requirements.txt textual pytest pexpect
      - run: pytest -q tests -rs
        env:
          QT_QPA_PLATFORM: offscreen
          SHELLDECK_TEST_SSH: "127.0.0.1:2222:tester:Secret123!"
          SHELLDECK_TEST_KEY: "${{ runner.temp }}/id_ed25519:pp"

  # 3) only if every test passed: build the apps (each build also runs a self-test)
  build:
    needs: [test, test-live]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest,   name: macos-arm64 }
          - { os: macos-13,       name: macos-x64 }
          - { os: ubuntu-22.04,   name: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name ShellDeck `
            --icon shelldeck/assets/app.ico --add-data "shelldeck/assets;shelldeck/assets" `
            --exclude-module tkinter run.py
          python packaging/prune_qt.py dist/ShellDeck
          $env:SHELLDECK_SELFTEST = "1"; $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist/ShellDeck/ShellDeck.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          Remove-Item Env:SHELLDECK_SELFTEST
          Remove-Item -Recurse -Force dist/ShellDeck/data -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/ShellDeck -DestinationPath "ShellDeck-${{ matrix.name }}.zip"

      - name: Build + test MSI installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_type }}" -eq "tag" ? "${{ github.ref_name }}" : ""
          ./packaging/windows/build_msi.ps1 -Version $v -Test

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name ShellDeck \
            --icon shelldeck/assets/app.png --osx-bundle-identifier ro.blamixology.shelldeck \
            --add-data "shelldeck/assets:shelldeck/assets" --exclude-module tkinter run.py
          python packaging/prune_qt.py dist/ShellDeck.app
          SHELLDECK_SELFTEST=1 QT_QPA_PLATFORM=offscreen dist/ShellDeck.app/Contents/MacOS/ShellDeck
          rm -rf dist/ShellDeck.app/../data
          cd dist && ditto -c -k --keepParent ShellDeck.app "../ShellDeck-${{ matrix.name }}.zip"

      - name: Build (Linux GUI + CLI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1
          pyinstaller --noconfirm --clean --onedir --windowed --name ShellDeck \
            --add-data "shelldeck/assets:shelldeck/assets" --exclude-module tkinter run.py
          python packaging/prune_qt.py dist/ShellDeck
          SHELLDECK_SELFTEST=1 QT_QPA_PLATFORM=offscreen QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox" dist/ShellDeck/ShellDeck
          rm -rf dist/ShellDeck/data
          cp shelldeck/assets/app.png dist/ShellDeck/shelldeck.png
          cp packaging/linux/install-desktop-entry.sh dist/ShellDeck/
          tar -C dist -czf "ShellDeck-${{ matrix.name }}.tar.gz" ShellDeck
          ./build_cli.sh
          cp dist/shelldeck-cli-*.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: ShellDeck-${{ matrix.name }}
          path: |
            ShellDeck-*.zip
            ShellDeck-*.msi
            ShellDeck-*.tar.gz
            shelldeck-cli-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
