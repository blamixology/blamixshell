name: build

# Run titles: "Release v1.2.3" for a tag, the PR title, "Manual build", else the pushed commit.
run-name: >-
  ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name)
  || github.event_name == 'pull_request' && format('PR: {0}', github.event.pull_request.title)
  || github.event_name == 'workflow_dispatch' && 'Manual build'
  || format('main: {0}', github.event.head_commit.message) }}

# What runs when:
#   push to main / pull request : the tests only (fast)
#   tag v*                      : tests + builds for every platform + the GitHub release
#   "Run workflow" button       : tests + builds (to try the packaging without tagging)
# release.sh pushes main and the tag together, so a release runs this twice: the main run
# only tests, the tag run builds and publishes.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # (path filters don't apply to tags: the tag run always runs)
    paths-ignore: ["CHANGELOG.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) fast unit/TUI tests on all three OSes
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: runner.os == 'Linux'
        run: bash .github/apt-install.sh libegl1 libxkbcommon0 libgl1
      - run: pip install -r requirements.txt textual pytest pexpect
      - run: pytest -q tests
        env: { QT_QPA_PLATFORM: offscreen }

  # 2) live tests against a real OpenSSH server: shell, resize, SFTP, key auth,
  #    jump host, host-key prompts, parallel exec, CLI + TUI in a real pty
  test-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Start a throwaway sshd on 127.0.0.1:2222
        run: |
          bash .github/apt-install.sh openssh-server libegl1 libxkbcommon0 libgl1
          sudo useradd -m -s /bin/bash tester
          echo 'tester:Secret123!' | sudo chpasswd
          ssh-keygen -t ed25519 -N pp -f "$RUNNER_TEMP/id_ed25519" -q
          sudo install -d -m 700 -o tester /home/tester/.ssh
          sudo install -m 600 -o tester "$RUNNER_TEMP/id_ed25519.pub" /home/tester/.ssh/authorized_keys
          printf 'Port 2222\nListenAddress 127.0.0.1\nPasswordAuthentication yes\nKbdInteractiveAuthentication no\nUsePAM yes\nSubsystem sftp /usr/lib/openssh/sftp-server\nPidFile /tmp/sshd-test.pid\n' > "$RUNNER_TEMP/sshd_config"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config"
          # a second one that only allows keyboard-interactive (how PAM / 2FA servers are set up)
          sed -e 's/^Port 2222/Port 2223/' -e 's/^PasswordAuthentication yes/PasswordAuthentication no/' \
              -e 's/^KbdInteractiveAuthentication no/KbdInteractiveAuthentication yes/' \
              -e 's#^PidFile .*#PidFile /tmp/sshd-kbd.pid#' "$RUNNER_TEMP/sshd_config" > "$RUNNER_TEMP/sshd_kbd_config"
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_kbd_config"
          sleep 1
      - run: pip install -r requirements.txt textual pytest pexpect
      - run: pytest -q tests -rs
        env:
          QT_QPA_PLATFORM: offscreen
          BLAMIXSHELL_TEST_SSH: "127.0.0.1:2222:tester:Secret123!"
          BLAMIXSHELL_TEST_SSH_KBD: "127.0.0.1:2223:tester:Secret123!"
          BLAMIXSHELL_TEST_KEY: "${{ runner.temp }}/id_ed25519:pp"

  # 3) only if every test passed: build the apps (each build also runs a self-test)
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, test-live]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest,   name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-22.04,   name: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/stamp_version.py "${{ github.ref_name }}"
      - name: Install
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name BlamixShell `
            --icon blamixshell/assets/app.ico --add-data "blamixshell/assets;blamixshell/assets" `
            --collect-all winpty --exclude-module tkinter run.py
          python packaging/prune_qt.py dist/BlamixShell
          $env:BLAMIXSHELL_SELFTEST = "1"; $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist/BlamixShell/BlamixShell.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          Remove-Item Env:BLAMIXSHELL_SELFTEST
          Remove-Item -Recurse -Force dist/BlamixShell/data -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/BlamixShell -DestinationPath "BlamixShell-${{ matrix.name }}.zip"

      - name: Build + test MSI installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_type }}" -eq "tag" ? "${{ github.ref_name }}" : ""
          ./packaging/windows/build_msi.ps1 -Version $v -Test

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name BlamixShell \
            --icon blamixshell/assets/app.png --osx-bundle-identifier ro.blamixology.blamixshell \
            --add-data "blamixshell/assets:blamixshell/assets" --exclude-module tkinter run.py
          python packaging/prune_qt.py dist/BlamixShell.app
          BLAMIXSHELL_SELFTEST=1 QT_QPA_PLATFORM=offscreen dist/BlamixShell.app/Contents/MacOS/BlamixShell
          rm -rf dist/BlamixShell.app/../data
          cd dist && ditto -c -k --keepParent BlamixShell.app "../BlamixShell-${{ matrix.name }}.zip"

      - name: Build (Linux GUI + CLI)
        if: runner.os == 'Linux'
        run: |
          bash .github/apt-install.sh libxcb-cursor0 libegl1
          pyinstaller --noconfirm --clean --onedir --windowed --name BlamixShell \
            --add-data "blamixshell/assets:blamixshell/assets" --exclude-module tkinter run.py
          python packaging/prune_qt.py dist/BlamixShell
          BLAMIXSHELL_SELFTEST=1 QT_QPA_PLATFORM=offscreen QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox" dist/BlamixShell/BlamixShell
          rm -rf dist/BlamixShell/data
          cp blamixshell/assets/app.png dist/BlamixShell/blamixshell.png
          cp packaging/linux/install-desktop-entry.sh dist/BlamixShell/
          tar -C dist -czf "BlamixShell-${{ matrix.name }}.tar.gz" BlamixShell
          ./build_cli.sh
          cp dist/blamixshell-cli-*.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: BlamixShell-${{ matrix.name }}
          path: |
            BlamixShell-*.zip
            BlamixShell-*.msi
            BlamixShell-*.tar.gz
            blamixshell-cli-*.tar.gz

  # 3b) the one-file command-line binary (no Qt, no Python needed on the server). It is built so that it runs on
  #     old servers too, started once on the oldest and a current system before it is uploaded, and a failure
  #     here never blocks the release (the release job below goes on without it).
  cli-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, test-live]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 packaging/stamp_version.py "${{ github.ref_name }}"
      - name: Python built for glibc 2.17 (uv's managed CPython), so the binary runs on CentOS 7 and newer
        run: |
          python3 -m pip install --user uv
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.12
          echo "CLI_PYTHON=$(uv python find --managed-python 3.12)" >> "$GITHUB_ENV"
      - name: Build the one-file binary (the script also runs its selftest)
        run: PYTHON="$CLI_PYTHON" ONEFILE=1 OUTNAME=blamixshell-linux-x86_64 ./build_cli.sh
      - name: It needs nothing newer than glibc 2.17
        run: |
          newest="$(objdump -T dist/blamixshell-linux-x86_64 | grep -o 'GLIBC_[0-9.]*' | sort -V | uniq | tail -1)"
          echo "newest glibc symbol needed: $newest"
          [ "$(printf '%s\n' "$newest" GLIBC_2.17 | sort -V | tail -1)" = "GLIBC_2.17" ]
      - name: Run it on CentOS 7 and on Debian 12
        run: |
          docker run --rm -v "$PWD/dist:/d:ro" centos:7 /d/blamixshell-linux-x86_64 selftest
          docker run --rm -v "$PWD/dist:/d:ro" debian:12-slim /d/blamixshell-linux-x86_64 selftest
      - uses: actions/upload-artifact@v4
        with:
          name: BlamixShell-cli-linux-x86_64
          path: dist/blamixshell-linux-x86_64

  cli-musl:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, test-live]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 packaging/stamp_version.py "${{ github.ref_name }}"
      - name: Build the one-file binary on Alpine (musl, for Alpine and other musl systems)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e ONEFILE=1 -e OUTNAME=blamixshell-linux-musl-x86_64 \
            python:3.12-alpine sh -c "apk add --no-cache bash binutils gcc musl-dev zlib-dev linux-headers && ./build_cli.sh"
      - name: Run it on a plain Alpine (no Python)
        run: docker run --rm -v "$PWD/dist:/d:ro" alpine:3.20 /d/blamixshell-linux-musl-x86_64 selftest
      - uses: actions/upload-artifact@v4
        with:
          name: BlamixShell-cli-linux-musl-x86_64
          path: dist/blamixshell-linux-musl-x86_64

  release:
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, cli-linux, cli-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # full history + tags
      - name: Release notes (commits since the previous tag)
        run: python3 packaging/release_notes.py "${{ github.ref_name }}" --repo "${{ github.repository }}" > release-notes.md
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: release-notes.md
